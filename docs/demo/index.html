<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="在模拟的 DeepSeek Harness 工作区准备发布会话、派发任务、汇总回执并整理会话。">
  <meta name="theme-color" content="#151517">
  <title>跨会话协作演示 · Session Hub</title>
  <link rel="icon" href="./harness-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./demo.css">
  <script src="./demo.js" type="module"></script>
</head>
<body>
  <main class="page">
    <h1 class="sr-only">Session Hub · V1.8 发布演示</h1>
    <section class="workspace" id="workspace" aria-label="Session Hub 演示工作区">
      <aside class="sidebar" aria-label="会话列表">
        <div class="sidebar-brand" role="img" aria-label="DeepSeek Harness">
          <img src="./harness-mark.svg" width="24" height="18" alt="">
          <img src="./harness-wordmark.svg" width="156" height="24" alt="">
        </div>
        <button type="button" class="new-session" data-chapter="prepare">
          <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M4.8 14.5a6.3 6.3 0 1 1 3 1.6L4 17zM10 7v6m-3-3h6"/></svg> 新会话
        </button>
        <p class="sidebar-label">工作区</p>
        <h2 class="project"><svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M2.8 15.6V5.7A1.7 1.7 0 0 1 4.5 4h3l2 2h5.8a1.4 1.4 0 0 1 1.4 1.4v1.3M2.8 15.6l2-5.3A1.4 1.4 0 0 1 6.1 9.4h11a1 1 0 0 1 .9 1.4l-2 4.8z"/></svg> 新版发布</h2>
        <div class="session-list" id="sessions"></div>
        <div class="chapter-sessions" id="chapter-sessions" hidden></div>
        <nav class="chapters" aria-label="发布演示章节">
          <p class="sidebar-label">V1.8 发布演示</p>
          <button type="button" data-chapter="prepare">准备会话</button>
          <button type="button" data-chapter="collaboration" aria-current="step">协作派发</button>
          <button type="button" data-chapter="summarize">汇总进展</button>
          <button type="button" data-chapter="close">发布收尾</button>
        </nav>
        <div class="sidebar-foot">
          <button type="button" class="reset-button" id="reset" disabled><span aria-hidden="true">↺</span> 重新演示</button>
          <a href="https://github.com/duo121/dsh-session-hub">GitHub ↗</a>
        </div>
      </aside>
      <section class="conversation" aria-label="当前会话">
        <header class="conversation-header">
          <h2 id="conversation-title">项目负责人</h2>
          <span class="mode">◈ 标准模式</span>
          <div class="collaboration" id="collaboration" hidden>
            <button class="expert-toggle" id="experts" type="button" aria-expanded="false" aria-controls="expert-panel"></button>
            <div class="expert-panel" id="expert-panel" hidden></div>
          </div>
        </header>
        <nav class="view-tabs" aria-label="会话视图">
          <button type="button" data-view="chat" aria-pressed="true">对话</button>
          <button type="button" data-view="trace" aria-pressed="false">轨迹</button>
        </nav>
        <div class="transcript" id="transcript" role="region" aria-label="会话消息" tabindex="0"></div>
        <div class="composer-slot" id="composer"></div>
      </section>
      <section class="scenario" id="scenario" aria-label="发布演示章节" hidden></section>
    </section>
    <div class="demo-guide" id="demo-guide" aria-hidden="true" hidden></div>
    <p class="page-footer">模拟工作区 · 四个章节可独立体验。协作派发时，跟着箭头发送任务并查看回执。</p>
    <p class="sr-only" id="announcement" role="status"></p>
    <noscript><p>启用 JavaScript 后即可发送任务并查看回执。</p></noscript>
  </main>
</body>
</html>
