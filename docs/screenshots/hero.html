<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: 'Montserrat'; src: url('file:///Users/apple/Documents/github/agnx/packages/dsh/client/ui-theme/src/styles/montserrat-regular.woff2') format('woff2'); font-weight: 400; }
  @font-face { font-family: 'Montserrat'; src: url('file:///Users/apple/Documents/github/agnx/packages/dsh/client/ui-theme/src/styles/montserrat-medium.woff2') format('woff2'); font-weight: 500; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:420px; background:#0F1115; overflow:hidden; font-family:'Montserrat',-apple-system,'PingFang SC',sans-serif; }
  .wrap { position:relative; width:1200px; height:420px; display:flex; align-items:center; padding:0 72px; }
  .glow1 { position:absolute; width:900px; height:900px; border-radius:50%; background:radial-gradient(circle, rgba(65,118,230,.26) 0%, rgba(65,118,230,0) 62%); top:-380px; right:-240px; }
  .glow2 { position:absolute; width:700px; height:700px; border-radius:50%; background:radial-gradient(circle, rgba(122,170,255,.10) 0%, rgba(122,170,255,0) 66%); bottom:-420px; left:-60px; }
  .left { position:relative; z-index:2; width:620px; }
  .badge { display:inline-flex; align-items:center; gap:8px; padding:6px 12px; border-radius:999px; background:rgba(65,118,230,.14); border:1px solid rgba(65,118,230,.34); color:#7AAAFF; font-size:12.5px; font-weight:500; letter-spacing:.3px; margin-bottom:22px; }
  .badge .dot { width:6px; height:6px; border-radius:50%; background:#7AAAFF; }
  h1 { font-size:52px; line-height:1.1; font-weight:500; color:#F9FAFB; letter-spacing:-.6px; margin-bottom:16px; }
  h1 .accent { background:linear-gradient(92deg,#7AAAFF,#4176E6); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .sub { font-size:15.5px; line-height:1.62; color:rgba(249,250,251,.56); max-width:560px; }
  .tags { display:flex; gap:8px; margin-top:26px; }
  .tag { padding:5px 11px; border-radius:7px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.09); color:rgba(249,250,251,.72); font-size:11.5px; }
  .right { position:relative; z-index:2; flex:1; display:flex; justify-content:flex-end; }
  .card { position:relative; z-index:3; width:400px; border-radius:16px; background:rgb(27,27,28); border:1px solid rgba(255,255,255,.10); box-shadow:0 24px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06); padding:14px; backdrop-filter:blur(12px); }
  .cardHead { display:flex; align-items:center; gap:7px; color:rgba(249,250,251,.92); font-size:13px; padding:4px 6px 12px; }
  .cardHead svg { flex:none; opacity:.9; }
  .cardHead .chev { margin-left:2px; opacity:.45; }
  .row { display:flex; align-items:flex-start; gap:9px; padding:9px 8px; border-radius:9px; }
  .row + .row { margin-top:2px; }
  .row.on { background:rgba(65,118,230,.13); }
  .spin { flex:none; width:14px; height:14px; margin-top:1px; border-radius:50%; border:2px solid rgba(122,170,255,.24); border-top-color:#7AAAFF; }
  .idle { flex:none; width:8px; height:8px; margin:5px 0 0 3px; border-radius:50%; background:rgba(249,250,251,.30); }
  .rtext { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .rtitle { font-size:12.5px; color:#F9FAFB; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rtitle .arrow { color:#7AAAFF; margin-right:5px; }
  .rmeta { font-size:10.5px; color:rgba(249,250,251,.42); }
  .divider { height:1px; background:rgba(255,255,255,.07); margin:6px 8px 0; }
  .foot { display:flex; align-items:center; gap:8px; padding:10px 8px 2px; font-size:10.5px; color:rgba(249,250,251,.34); }
  .pill { padding:3px 8px; border-radius:999px; background:rgba(65,118,230,.16); color:#7AAAFF; font-size:10px; }
</style></head>
<body><div class="wrap">
  <div class="glow1"></div><div class="glow2"></div>
  <div class="left">
    <div class="badge"><span class="dot"></span>DSH PLUGIN</div>
    <h1>Session <span class="accent">Hub</span></h1>
    <div class="sub">让会话之间互相说话。<br>一个 <b style="color:rgba(249,250,251,.82)">session</b> 工具管理所有会话，头部协作专家随时回到往来现场。</div>
    <div class="tags"><span class="tag">跨会话消息</span><span class="tag">协作专家</span><span class="tag">自动回执</span><span class="tag">零源码改动</span></div>
  </div>
  <div class="right"><div class="card">
    <div class="cardHead">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7AAAFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      3 个协作专家
      <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
    </div>
    <div class="row on"><div class="spin"></div><div class="rtext"><div class="rtitle"><span class="arrow">→</span>重构认证中间件</div><div class="rmeta">正在运行 · 刚刚</div></div></div>
    <div class="row"><div class="idle"></div><div class="rtext"><div class="rtitle"><span class="arrow" style="color:rgba(249,250,251,.34)">←</span>补齐接口文档</div><div class="rmeta">空闲 · 12 分钟前</div></div></div>
    <div class="row"><div class="idle"></div><div class="rtext"><div class="rtitle"><span class="arrow" style="color:rgba(249,250,251,.34)">←</span>压测脚本准备</div><div class="rmeta">空闲 · 2 小时前 · 已归档</div></div></div>
    <div class="divider"></div>
    <div class="foot"><span class="pill">receipt: true</span>目标这一轮结束后，回复自动回传</div>
  </div></div>
</div></body></html>
