<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face{font-family:'Montserrat';src:url('file:///Users/apple/Documents/github/agnx/packages/dsh/client/ui-theme/src/styles/montserrat-regular.woff2') format('woff2');font-weight:400}
  @font-face{font-family:'Montserrat';src:url('file:///Users/apple/Documents/github/agnx/packages/dsh/client/ui-theme/src/styles/montserrat-medium.woff2') format('woff2');font-weight:500}
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:460px;background:#0F1115;overflow:hidden;font-family:'Montserrat',-apple-system,'PingFang SC',sans-serif}
  .wrap{position:relative;width:1200px;height:460px;display:flex;align-items:center;padding:0 40px 0 60px;gap:0}
  .g1{position:absolute;width:1000px;height:1000px;border-radius:50%;background:radial-gradient(circle,rgba(65,118,230,.26) 0%,rgba(65,118,230,0) 62%);top:-420px;right:-300px}
  .g2{position:absolute;width:760px;height:760px;border-radius:50%;background:radial-gradient(circle,rgba(122,170,255,.10) 0%,rgba(122,170,255,0) 66%);bottom:-460px;left:-120px}
  .left{position:relative;z-index:2;width:470px;flex:none}
  .badge{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:rgba(65,118,230,.14);border:1px solid rgba(65,118,230,.34);color:#7AAAFF;font-size:12px;font-weight:500;letter-spacing:.4px;margin-bottom:20px}
  .badge .d{width:6px;height:6px;border-radius:50%;background:#7AAAFF}
  h1{font-size:50px;line-height:1.08;font-weight:500;color:#F9FAFB;letter-spacing:-.6px;margin-bottom:15px}
  h1 .accent{background:linear-gradient(92deg,#7AAAFF,#4176E6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .sub{font-size:14.5px;line-height:1.66;color:rgba(249,250,251,.56);max-width:440px}
  .tags{display:flex;gap:8px;margin-top:24px;flex-wrap:wrap}
  .tag{padding:5px 11px;border-radius:7px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);color:rgba(249,250,251,.72);font-size:11.5px}
  .mid{position:relative;z-index:3;flex:none;width:330px;display:flex;align-items:flex-end;justify-content:center;height:460px;margin:0 8px 0 14px}
  .mid img{width:352px;margin-bottom:-8px;filter:drop-shadow(0 18px 42px rgba(65,118,230,.34))}
  .msg{position:absolute;top:96px;right:6px;background:rgba(65,118,230,.20);border:1px solid rgba(65,118,230,.44);color:#BBD4FF;font-size:11.5px;padding:6px 11px;border-radius:10px;backdrop-filter:blur(8px);white-space:nowrap}
  .msg:after{content:"";position:absolute;left:-5px;top:14px;width:8px;height:8px;background:inherit;border-left:1px solid rgba(65,118,230,.44);border-bottom:1px solid rgba(65,118,230,.44);transform:rotate(45deg)}
  .right{position:relative;z-index:2;flex:1;display:flex;justify-content:flex-end;min-width:0}
  .card{width:296px;flex:none;border-radius:15px;background:rgb(27,27,28);border:1px solid rgba(255,255,255,.10);box-shadow:0 22px 54px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);padding:13px}
  .ch{display:flex;align-items:center;gap:7px;color:rgba(249,250,251,.92);font-size:12.5px;padding:3px 5px 10px}
  .ch .chev{margin-left:2px;opacity:.45}
  .row{display:flex;align-items:flex-start;gap:8px;padding:8px 7px;border-radius:8px}
  .row.on{background:rgba(65,118,230,.13)}
  .spin{flex:none;width:13px;height:13px;margin-top:2px;border-radius:50%;border:2px solid rgba(122,170,255,.24);border-top-color:#7AAAFF}
  .idle{flex:none;width:7px;height:7px;margin:6px 0 0 3px;border-radius:50%;background:rgba(249,250,251,.30)}
  .rt{display:flex;flex-direction:column;gap:1px;min-width:0}
  .rl{font-size:12px;color:#F9FAFB;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rl .ar{color:#7AAAFF;margin-right:4px}
  .rm{font-size:10px;color:rgba(249,250,251,.42)}
  .div{height:1px;background:rgba(255,255,255,.07);margin:5px 7px 0}
  .ft{display:flex;align-items:center;gap:7px;padding:9px 7px 1px;font-size:10px;color:rgba(249,250,251,.34)}
  .pill{padding:3px 8px;border-radius:999px;background:rgba(65,118,230,.16);color:#7AAAFF;font-size:9.5px}
</style></head><body><div class="wrap">
  <div class="g1"></div><div class="g2"></div>
  <div class="left">
    <div class="badge"><span class="d"></span>DSH PLUGIN</div>
    <h1>Session <span class="accent">Hub</span></h1>
    <div class="sub">让会话之间互相说话。<br>一个 <b style="color:rgba(249,250,251,.82)">session</b> 工具管理所有会话，头部协作专家随时回到往来现场。</div>
    <div class="tags"><span class="tag">跨会话消息</span><span class="tag">协作专家</span><span class="tag">自动回执</span><span class="tag">零源码改动</span></div>
  </div>
  <div class="mid">
    <img src="file:///tmp/mascot/mascot-trim.png" alt="">
  </div>
  <div class="right"><div class="card">
    <div class="ch">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#7AAAFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      3 个协作专家
      <svg class="chev" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
    </div>
    <div class="row on"><div class="spin"></div><div class="rt"><div class="rl"><span class="ar">→</span>重构认证中间件</div><div class="rm">正在运行 · 刚刚</div></div></div>
    <div class="row"><div class="idle"></div><div class="rt"><div class="rl"><span class="ar" style="color:rgba(249,250,251,.34)">←</span>补齐接口文档</div><div class="rm">空闲 · 12 分钟前</div></div></div>
    <div class="row"><div class="idle"></div><div class="rt"><div class="rl"><span class="ar" style="color:rgba(249,250,251,.34)">←</span>压测脚本准备</div><div class="rm">空闲 · 2 小时前 · 已归档</div></div></div>
    <div class="div"></div>
    <div class="ft"><span class="pill">receipt: true</span>对方这一轮结束，回复自动回传</div>
  </div></div>
</div></body></html>
